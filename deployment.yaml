```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lms-portal
  template:
    metadata:
      labels:
        app: lms-portal
    spec:
      containers:
        - name: lms-container
          image: priyadharshinib733/lms-portal:v1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: lms-portal-service
spec:
  type: NodePort
  selector:
    app: lms-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30013
```
